version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
    PYTHONPATH: /opt/airflow/project/src
    CTF_PROJECT_ROOT: /opt/airflow/project
    MLFLOW_TRACKING_URI: http://mlflow:5000
    CTF_REGISTERED_MODEL_NAME: colombia-tourism-forecasting
    CTF_MODEL_ALIAS: champion
    CTF_API_BASE_URL: http://api:8000
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./Data:/opt/airflow/project/Data
    - ./artifacts:/opt/airflow/project/artifacts
    - ./mlruns:/opt/airflow/project/mlruns
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: colombia-tourism-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: .
      target: mlflow-server
    container_name: colombia-tourism-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 15s
      timeout: 10s
      retries: 5

  data_pipeline:
    build:
      context: .
      target: data-pipeline
    container_name: colombia-tourism-data-pipeline
    profiles: ["jobs"]
    command:
      - python
      - scripts/package_data.py
      - --data
      - Data/Base Final1.csv
      - --output-dir
      - artifacts/data/base_final_package
    volumes:
      - ./Data:/app/Data:ro
      - ./artifacts:/app/artifacts

  trainer:
    build:
      context: .
      target: trainer
    container_name: colombia-tourism-trainer
    profiles: ["jobs"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command:
      - python
      - scripts/train.py
      - --data-package-dir
      - artifacts/data/base_final_package
      - --model
      - xgboost
      - --registered-model-name
      - colombia-tourism-forecasting
    volumes:
      - ./Data:/app/Data:ro
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns

  drift_monitor:
    build:
      context: .
      target: drift-monitor
    container_name: colombia-tourism-drift-monitor
    profiles: ["monitoring"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command:
      - python
      - scripts/check_drift.py
      - --reference-dir
      - artifacts/data/base_final_package
      - --current-data
      - Data/Base Final1.csv
      - --output-dir
      - artifacts/drift/latest
      - --retrain-on-drift
    volumes:
      - ./Data:/app/Data:ro
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns

  api:
    build:
      context: .
      target: api-server
    container_name: colombia-tourism-api
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - CTF_REGISTERED_MODEL_NAME=colombia-tourism-forecasting
      - CTF_MODEL_ALIAS=champion
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./artifacts:/app/artifacts
      - ./Data:/app/Data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 20s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      target: streamlit-app
    container_name: colombia-tourism-app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8501:8501"
    volumes:
      - ./mlruns:/app/mlruns
      - ./artifacts:/app/artifacts
      - ./Data:/app/Data:ro

  airflow-init:
    <<: *airflow-common
    container_name: colombia-tourism-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >
        airflow db migrate &&
        (airflow users create
        --username airflow
        --password airflow
        --firstname Airflow
        --lastname Admin
        --role Admin
        --email airflow@example.com || true)
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: colombia-tourism-airflow-apiserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: colombia-tourism-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    container_name: colombia-tourism-airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

  airflow-triggerer:
    <<: *airflow-common
    container_name: colombia-tourism-airflow-triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: triggerer

volumes:
  postgres-db-volume:
  airflow-logs:
